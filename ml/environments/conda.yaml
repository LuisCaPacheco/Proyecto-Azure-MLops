name: mlops-dropout-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # Misma versión que el endpoint (endpoint/requirements.txt): el modelo
      # se serializa con cloudpickle y debe leerse con el mismo scikit-learn.
      - scikit-learn==1.9.1
      - cloudpickle==3.1.2
      - pandas>=2.1.4
      - numpy>=1.26.4
      - scipy>=1.11
      - matplotlib>=3.8
      - mlflow>=2.9,<3
      - joblib>=1.3.2
      # Habilita el plugin de Model Registry de Azure ML para MLflow
      - azureml-mlflow
